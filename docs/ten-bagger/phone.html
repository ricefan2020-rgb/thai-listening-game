<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base href="/thai-listening-game/ten-bagger/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手機安裝 · 10x 觀察板</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="10x觀察板" />
  <link rel="apple-touch-icon" href="./icon-192.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #090909;
      color: #ececec;
      font-family: system-ui, sans-serif;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 { font-size: 1.25rem; color: #d4af37; }
    p { font-size: 0.9rem; color: #8a8a8a; line-height: 1.5; max-width: 360px; text-align: center; }
    .qr {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
    }
    .qr img { display: block; width: 220px; height: 220px; }
    .url {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      word-break: break-all;
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      padding: 12px;
      border-radius: 8px;
      max-width: 100%;
      color: #8ec8ff;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #d4af37;
      color: #090909;
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
      font-size: 1rem;
    }
    ol {
      text-align: left;
      font-size: 0.85rem;
      color: #bbb;
      max-width: 340px;
      padding-left: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>📱 10x 觀察板 · 手機</h1>
  <p>Mac 與手機需連<strong>同一 Wi‑Fi</strong>。在 Mac 執行：<code>node scripts/serve-mobile.mjs</code></p>

  <div class="qr" id="qr-wrap">
    <img id="qr" alt="QR code" width="220" height="220" />
  </div>

  <div class="url" id="board-url">載入中…</div>

  <a class="btn" id="open-btn" href="./index.html">開啟觀察板</a>

  <ol>
    <li><strong>iPhone Safari</strong>：分享 →「加入主畫面」</li>
    <li><strong>Android Chrome</strong>：選單 →「安裝應用程式」或「加到主畫面」</li>
    <li>翻譯、Reddit、新聞需網路；資料已嵌入 HTML 可離線看報價/K線（若已更新）</li>
  </ol>

  <script>
    const board = new URL("index.html", document.baseURI).href;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(board)}`;
    document.getElementById("qr").src = qrUrl;
    document.getElementById("board-url").textContent = board;
    document.getElementById("open-btn").href = board;
  </script>
</body>
</html>
